packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 起 settings 从 package.json 的 "pnpm" 字段迁入本文件，且构建脚本
# 放行改用 allowBuilds map（onlyBuiltDependencies 已是 legacy、不再生效）。
# strictDepBuilds 默认为 true，未登记的依赖构建脚本会让 install 直接失败。
# 本清单是给 esbuild 及 core-js / es5-ext 等带 postinstall 的依赖兜底。
# 2026-11-15：数据库改用 Node 内置 node:sqlite，better-sqlite3 已移除，
# 因此不再需要为任何原生扩展放行构建。
allowBuilds:
  esbuild: true
  core-js: true
  core-js-pure: true
  es5-ext: true

# umi 4.7.31 发布时间距当前不足 7 天，pnpm 12 默认的 minimumReleaseAge
# 会拒绝安装；本项目为个人自用且版本由锁文件固定，关闭该成熟度检查。
minimumReleaseAge: 0
