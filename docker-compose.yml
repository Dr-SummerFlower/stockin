# 进货统计应用 —— 单机部署编排
#
# 用法：在与本文件同目录创建 .env，设置
#   IMAGE_REPO=<镜像仓库，如 ghcr.io/<owner>/stockin；制品包内已由 CI 填好>
#   IMAGE_TAG=<GitHub Release 的版本号或 pre>
#   PUBLIC_ORIGINS=<逗号分隔的全部访问地址，见下方「端口同步」>
# 然后：docker compose up -d。也可直接运行随制品附带的 start.sh / start.bat，
#       它会自动探测本机 IP 生成白名单后再启动。
#
# 【来源白名单】漏配任何实际访问地址，从该地址登录 / 写数据都会返回
# 「请求来源校验失败」(403 AUTH_CSRF_FAILED)。镜像内已预置回环基线。
#
# 【镜像来源】不再本地构建：CI 把 linux/amd64 镜像推到 GHCR，
# 由 IMAGE_TAG 选定版本；升级 = 改 IMAGE_TAG 后重新 up -d，
# 回滚 = 改回上一版 IMAGE_TAG 后重新 up -d。
# 发布用的压缩包已附带本文件与 .env 模板，解压后无需源码即可启动。
#
# 【端口同步 · 重要】
#  - 容器内固定监听 8080（Dockerfile: ENV PORT=8080 / EXPOSE 8080）。
#  - env.ts 强制校验每个来源的端口必须等于容器 PORT(8080)，否则启动即 fail-fast。
#  - env.ts/csrf.ts 按可信来源集合（PUBLIC_ORIGINS，缺省回落到 PUBLIC_ORIGIN）去掉
#    http:// 后的字面量比对浏览器 Host 头（刻意忽略 X-Forwarded-*）；浏览器 Host 里的
#    端口就是 URL 里的宿主端口。
#  - 因此来源端口、HOST_PORT、容器 PORT 三者必须一致，默认全为 8080。
#    若单独把 HOST_PORT 改成非 8080，Host 变为 <IP>:<HOST_PORT> 与来源不匹配，
#    会让所有写操作返回 403 AUTH_CSRF_FAILED。
#
# 【卷】data / backups 用命名卷持久化；首次创建时 Docker 会继承镜像内目录属主
#  （Dockerfile 已 chown 10001:10001），保证 USER 10001 可写。
#  tmp 用 tmpfs（32MB，mode=1777 让非 root 可写），与 TMPFS_BYTES 一致，
#  且不在静态托管根之下（loadEnv / static.ts 双重守卫）。

services:
  stockin:
    # 镜像仓库与标签都来自 .env：CI 按仓库归属自动写入 IMAGE_REPO，换账号或
    # fork 后不需要改本文件；升级只改 IMAGE_TAG。
    image: ${IMAGE_REPO:-ghcr.io/dr-summerflower/stockin}:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: stockin
    restart: unless-stopped
    # 优雅停机：index.ts 监听 SIGTERM 停调度器 → server.close → closeDatabase。
    stop_grace_period: 40s
    mem_limit: 768m
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # 【来源白名单】把所有可能用到的访问地址都列进 PUBLIC_ORIGINS，逗号分隔，
      # 每个都必须是含端口的 http 字面量；漏配任何地址，从该地址登录/写数据
      # 都会返回「请求来源校验失败」(403 AUTH_CSRF_FAILED)。
      # PUBLIC_ORIGINS 一旦设置即覆盖 PUBLIC_ORIGIN（env.ts 的既定优先级）。
      # 回环写法会自动等价展开到 127.0.0.1 / localhost / [::1]。
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: "8080"
      COOKIE_SECURE: "false"
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      TMP_DIR: /app/tmp
      WEB_DIST_DIR: /app/apps/web/dist
      NODE_OPTIONS: "--max-old-space-size=512"
      # 【管理员入口 · 可选】三项缺一即禁用管理员（店主侧不受影响）。
      # 值来自 .env；GitHub OAuth App 的回调地址填 <入口>/api/admin/auth/github/callback。
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
      # 【逻辑备份 · 可选】默认公钥（P-256 SPKI/DER base64，单行）来自 .env。
      # 私钥只留本地 .keys/，不要写进 .env、镜像或仓库。
      # 只在首次启动、库内没有任何公钥时播种一条；此后轮换/增删全在管理台
      # 「备份公钥」里做（入库，无需重建容器），本变量不再参与运行期逻辑。
      # 改完需 `docker compose up -d` 重建容器（restart 不会重读环境变量）。
      BACKUP_PUBLIC_KEY: ${BACKUP_PUBLIC_KEY:-}
    volumes:
      - stockin-data:/app/data
      - stockin-backups:/app/backups
    tmpfs:
      - /app/tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stockin-data:
  stockin-backups:
