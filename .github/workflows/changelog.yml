name: 更新变更记录

# 用 git-cliff 从 Conventional Commits 重新生成 CHANGELOG.md；有变化则以
# github-actions[bot] 身份提交回去。
#
# 自动触发已停用（2026-11-23）：正常发版由 scripts/release.mjs 在打 tag 前
# 本地生成 CHANGELOG，并随版本提交一起推送；release.yml 不再在发布后写回。
# 这里只保留 workflow_dispatch，作为需要时手动重建 CHANGELOG 的后备工具。
#
# 防循环：bot 提交信息含 `[skip ci]`，不会触发新的 workflow run。生成用的提交
# 也被 cliff.toml 的 `^chore\(changelog\)` 规则跳过，不出现在 CHANGELOG 内容里。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-manual
  cancel-in-progress: false

jobs:
  update-changelog:
    name: 生成并提交 CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（完整历史，git-cliff 需要 tag 与 commit）
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 安装 Node.js（版本取自 .node-version）
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version

      - name: 安装 pnpm
        run: npm install -g pnpm@12.15.0 && pnpm --version

      - name: 冻结依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 CHANGELOG.md
        run: pnpm changelog

      - name: 有变化则提交回默认分支
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(changelog): 手动重建变更记录 [skip ci]"
          git push origin HEAD:"${TARGET_BRANCH}"
